    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tranzit_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || saved === 'system' || !saved) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500/20 font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
